spring.application.name=SpringBootProject
server.port=8081

server.error.include-binding-errors=always
server.error.include-message=always
server.error.include-stacktrace=always

#uygulamaya nasil calistigini soyledigimiz dosya burasi.
#cok basit bir konfigurasyonu var.

#db bilgileri
spring.datasource.url=jdbc:postgresql://localhost:5432/spring_boot_345
spring.datasource.username=techpront
spring.datasource.password=kenan

#hibernate bilgileri
#ddl-auto gelistirme asamasinda genelde create'te tutulur.
#gelistirilmesi biten uygulama test edilirken create-drop
#uygulama canliya alindiktan sonra update'te kalir.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.properties.hibernate.format_sql=true
