server:
  port: 8082
  error:
    include-binding-errors: always
    include-message: always
    include-stacktrace: never

spring:
  application:
    name: "SpringBootProject"
  datasource:
    url: jdbc:postgresql://localhost:5432/spring_boot_345
    username: techpront
    password: kenan
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQL10Dialect
    properties:
      '[hibernate.format_sql]': true
  security:
    user:
      name: user
      password: password

logging:
  file:
    name: log/studentapp.log
  pattern:
    file: "%d %-5level [%thread] %logger:%msg%n"
  level:
    '[org.springframework.web]': WARN
    '[org.hibernate]': INFO
    '[com.tpe.SpringBootProject]': INFO